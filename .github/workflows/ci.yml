name: ci

# 12 §5: build · matrix · publish. No workflow-level paths filter: matrix decides by a job condition.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # 12 §5 H4: @stynx-nyx/* are private packages of another organisation, which GITHUB_TOKEN cannot read;
  # STYNX_READ_TOKEN (read:packages) is the install token, GITHUB_TOKEN the fallback.
  NODE_AUTH_TOKEN: ${{ secrets.STYNX_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.changes.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: pnpm
      - name: Build and test (12 §5)
        run: pnpm install --frozen-lockfile && pnpm -r --if-present build && pnpm -r --if-present test
      - name: Did packages/cli/** change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$REF" in refs/tags/v*) echo cli=true >> "$GITHUB_OUTPUT"; exit 0;; esac
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else base=$BEFORE; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo cli=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$base" "$GITHUB_SHA" -- packages/cli/; then echo cli=false; else echo cli=true; fi >> "$GITHUB_OUTPUT"

  matrix:
    needs: [build]
    if: needs.build.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [bare, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 09 §4 cells (O1–O16, N1–N12)
        env:
          REF: ${{ github.ref }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          # The 09 §4 cells need src/main.ts (R6) and the published STYNX <v> (R5); they are
          # written into this job at R8. Until then the job passes on branches and refuses tags,
          # so publish cannot run on an unfilled matrix.
          echo "matrix ($RUNTIME): 09 §4 cells not yet present (filled at R8)"
          case "$REF" in refs/tags/v*) exit 1;; esac

  publish:
    needs: [build, matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: git fetch origin main && git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5; version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile && pnpm -r --if-present build
      - name: Publish
        run: pnpm -r publish --no-git-checks
